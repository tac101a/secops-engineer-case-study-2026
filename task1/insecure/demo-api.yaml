apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: secops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      serviceAccountName: demo-api
      containers:
        - name: demo-api
          image: secops-demo-api:phase-b
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              value: http://demo-backend:8081
          # H1/H4 candidate conditions: image USER 0, no privilege restrictions,
          # writable root. Effective authority and extra writes await Phase C.
          securityContext:
            readOnlyRootFilesystem: false
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: secops-demo
spec:
  selector:
    app: demo-api
  ports:
    - name: http
      port: 8080
      targetPort: http
