apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: f1-demo-api-process-security
  annotations:
    policies.kyverno.io/title: Demo API process security
    policies.kyverno.io/category: SecOps case study F1
    policies.kyverno.io/description: >-
      Reports a demo-api Pod or Deployment whose containers do not declare
      the selected F1 process, root-filesystem, and writable-mount
      restrictions.
spec:
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
  matchConditions:
    - name: secops-demo-namespace
      expression: object.metadata.namespace == 'secops-demo'
    - name: demo-api-service-account
      expression: >-
        (object.kind == 'Pod' &&
          object.spec.?serviceAccountName.orValue('default') == 'demo-api') ||
        (object.kind == 'Deployment' &&
          object.spec.template.spec.?serviceAccountName.orValue('default') == 'demo-api')
  variables:
    - name: workloadSpec
      expression: >-
        object.kind == 'Pod' ? object.spec : object.spec.template.spec
    - name: allContainers
      expression: >-
        variables.workloadSpec.containers +
        variables.workloadSpec.?initContainers.orValue([]) +
        variables.workloadSpec.?ephemeralContainers.orValue([])
    - name: applicationContainers
      expression: >-
        variables.workloadSpec.containers.filter(c, c.name == 'demo-api')
    - name: workloadVolumes
      expression: >-
        variables.workloadSpec.?volumes.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          c.securityContext.?runAsNonRoot.orValue(false) == true)
      message: >-
        Policy evaluation identified a demo-api container without
        securityContext.runAsNonRoot=true.
    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          c.securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: >-
        Policy evaluation identified a demo-api container without
        securityContext.allowPrivilegeEscalation=false.
    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.capabilities) &&
          c.securityContext.capabilities.?drop.orValue([]).exists(capability,
            capability == 'ALL') &&
          c.securityContext.capabilities.?add.orValue([]).size() == 0)
      message: >-
        Policy evaluation identified a demo-api container that does not drop
        all Linux capabilities or that adds a capability back.
    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          c.securityContext.?readOnlyRootFilesystem.orValue(false) == true)
      message: >-
        Policy evaluation identified a demo-api container without
        securityContext.readOnlyRootFilesystem=true.
    - expression: >-
        variables.workloadVolumes.exists(volume,
          volume.name == 'api-tmp' && has(volume.emptyDir))
      message: >-
        Policy evaluation identified a demo-api workload without the required
        api-tmp emptyDir volume.
    - expression: >-
        variables.applicationContainers.size() == 1 &&
        variables.applicationContainers.all(container,
          container.?volumeMounts.orValue([]).exists(mount,
            mount.name == 'api-tmp' &&
            mount.mountPath == '/tmp' &&
            mount.?readOnly.orValue(false) == false &&
            !has(mount.subPath) &&
            !has(mount.subPathExpr)))
      message: >-
        Policy evaluation identified a demo-api application container without
        one direct writable api-tmp mount at /tmp.
    - expression: >-
        variables.allContainers.all(container,
          container.?volumeMounts.orValue([]).all(mount,
            !(
              (mount.mountPath == '/app' || mount.mountPath.startsWith('/app/')) &&
              mount.?readOnly.orValue(false) == false
            )))
      message: >-
        Policy evaluation identified a writable volume mount at /app or below
        /app in a demo-api container.
