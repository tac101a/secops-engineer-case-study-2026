apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: f2-workload-credentials
  annotations:
    policies.kyverno.io/title: Protected workload credentials
    policies.kyverno.io/category: SecOps case study F2
    policies.kyverno.io/description: >-
      Reports unexpected credentials, token-path mounts, or identity
      substitution for the demo-api and demo-backend workloads in secops-demo.
spec:
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
          - serviceaccounts
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
  matchConditions:
    - name: secops-demo-namespace
      expression: object.metadata.namespace == 'secops-demo'
    - name: protected-service-account-or-workload
      expression: >-
        (object.kind == 'ServiceAccount' &&
          object.metadata.name in ['demo-api', 'demo-backend']) ||
        (object.kind == 'Pod' &&
          object.spec.?serviceAccountName.orValue('default') in
            ['demo-api', 'demo-backend']) ||
        (object.kind == 'Deployment' &&
          (object.spec.template.spec.?serviceAccountName.orValue('default') in
            ['demo-api', 'demo-backend'] ||
            object.metadata.name in ['demo-api', 'demo-backend']))
  variables:
    - name: workloadVolumes
      expression: >-
        object.kind == 'ServiceAccount'
          ? []
          : (object.kind == 'Pod'
            ? object.spec.?volumes.orValue([])
            : object.spec.template.spec.?volumes.orValue([]))
    - name: workloadContainers
      expression: >-
        object.kind == 'ServiceAccount'
          ? []
          : (object.kind == 'Pod'
            ? object.spec.containers +
              object.spec.?initContainers.orValue([]) +
              object.spec.?ephemeralContainers.orValue([])
            : object.spec.template.spec.containers +
              object.spec.template.spec.?initContainers.orValue([]) +
              object.spec.template.spec.?ephemeralContainers.orValue([]))
  validations:
    - expression: >-
        object.kind != 'ServiceAccount' ||
        (has(object.automountServiceAccountToken) &&
          object.automountServiceAccountToken == false)
      message: >-
        Policy evaluation identified a protected ServiceAccount without
        automountServiceAccountToken=false.
    - expression: >-
        object.kind == 'ServiceAccount' ||
        (object.kind == 'Pod'
          ? object.spec.?automountServiceAccountToken.orValue(false) != true
          : object.spec.template.spec.?automountServiceAccountToken.orValue(false) != true)
      message: >-
        Policy evaluation identified a protected workload that enables
        automatic ServiceAccount token mounting.
    - expression: >-
        object.kind == 'ServiceAccount' ||
        !variables.workloadVolumes.exists(volume,
          has(volume.projected) &&
          volume.projected.?sources.orValue([]).exists(source,
            has(source.serviceAccountToken)))
      message: >-
        Policy evaluation identified an explicit ServiceAccount token
        projection in a protected workload.
    - expression: >-
        object.kind == 'ServiceAccount' ||
        !variables.workloadVolumes.exists(volume, has(volume.secret))
      message: >-
        Policy evaluation identified an ordinary Secret-backed volume in a
        protected workload.
    - expression: >-
        object.kind == 'ServiceAccount' ||
        !variables.workloadVolumes.exists(volume,
          has(volume.projected) &&
          volume.projected.?sources.orValue([]).exists(source,
            has(source.secret)))
      message: >-
        Policy evaluation identified a Secret source inside a projected volume
        in a protected workload.
    - expression: >-
        object.kind == 'ServiceAccount' ||
        variables.workloadContainers.all(container,
          container.?volumeMounts.orValue([]).all(mount,
            !(mount.mountPath ==
                '/var/run/secrets/kubernetes.io/serviceaccount' ||
              mount.mountPath.startsWith(
                '/var/run/secrets/kubernetes.io/serviceaccount/'))))
      message: >-
        Policy evaluation identified a volume mount at the Kubernetes
        ServiceAccount token path in a protected workload.
    - expression: >-
        object.kind != 'Deployment' ||
        object.metadata.name != 'demo-api' ||
        object.spec.template.spec.?serviceAccountName.orValue('default') ==
          'demo-api'
      message: >-
        Policy evaluation identified canonical Deployment secops-demo/demo-api
        using an unexpected ServiceAccount.
    - expression: >-
        object.kind != 'Deployment' ||
        object.metadata.name != 'demo-backend' ||
        object.spec.template.spec.?serviceAccountName.orValue('default') ==
          'demo-backend'
      message: >-
        Policy evaluation identified canonical Deployment
        secops-demo/demo-backend using an unexpected ServiceAccount.
