# Scope boundary: an unrelated workload is intentionally outside F2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unrelated-workload
  namespace: secops-demo
spec:
  selector:
    matchLabels:
      app: unrelated-workload
  template:
    metadata:
      labels:
        app: unrelated-workload
    spec:
      serviceAccountName: unrelated
      containers:
        - name: unrelated
          image: example.invalid/unrelated:test
      volumes:
        - name: unrelated-secret
          secret:
            secretName: unrelated-secret
---
# Explicit identity-scoping boundary: name, labels, and ServiceAccount all
# differ, so this Pod is indistinguishable from an unrelated workload here.
apiVersion: v1
kind: Pod
metadata:
  name: fully-renamed-identity-boundary
  namespace: secops-demo
  labels:
    component: unrelated
spec:
  serviceAccountName: unrelated
  containers:
    - name: unrelated
      image: example.invalid/unrelated:test
  volumes:
    - name: renamed-secret
      secret:
        secretName: unexpected-credential
---
# Coverage-boundary fixture: this indirect group path is intentionally outside
# the narrow direct-ServiceAccount-subject rule. Its evaluation is not a
# security-compliance pass.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: protected-namespace-group-boundary
subjects:
  - kind: Group
    name: system:serviceaccounts:secops-demo
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
